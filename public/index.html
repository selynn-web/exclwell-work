<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>团队档案台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style id="app-style">
  :root{
    --paper:#F1ECDE; --surface:#FFFFFF; --surface-2:#FBF7EC;
    --ink:#24231F; --ink-dim:#635D4E; --ink-faint:#948C77;
    --line:rgba(36,35,31,0.14); --line-soft:rgba(36,35,31,0.08);
    --accent:#2C4A52; --accent-ink:#FFFFFF; --accent-soft:rgba(44,74,82,0.10); --accent-soft-2:rgba(44,74,82,0.20);
    --seal:#B23A2E; --seal-soft:rgba(178,58,46,0.12);
    --good:#3C7A5B; --good-soft:rgba(60,122,91,0.12);
    --warn:#9C6B1F; --warn-soft:rgba(156,107,31,0.14);
    --neutral:#7A7462; --neutral-soft:rgba(122,116,98,0.13);
    --shadow:0 1px 2px rgba(36,35,31,0.06), 0 10px 28px rgba(36,35,31,0.10);
    --radius-sm:5px; --radius-md:9px; --radius-lg:16px;
    --font-display:'Noto Serif SC','Songti SC',serif;
    --font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1A17; --surface:#221F19; --surface-2:#28251D;
      --ink:#ECE7D8; --ink-dim:#B4AC97; --ink-faint:#847C68;
      --line:rgba(236,231,216,0.14); --line-soft:rgba(236,231,216,0.08);
      --accent:#82B3BB; --accent-ink:#12201F; --accent-soft:rgba(130,179,187,0.14); --accent-soft-2:rgba(130,179,187,0.26);
      --seal:#E27967; --seal-soft:rgba(226,121,103,0.16);
      --good:#71C199; --good-soft:rgba(113,193,153,0.15);
      --warn:#E1AE58; --warn-soft:rgba(225,174,88,0.16);
      --neutral:#9C9480; --neutral-soft:rgba(156,148,128,0.15);
      --shadow:0 1px 2px rgba(0,0,0,0.35), 0 10px 28px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1A17; --surface:#221F19; --surface-2:#28251D;
    --ink:#ECE7D8; --ink-dim:#B4AC97; --ink-faint:#847C68;
    --line:rgba(236,231,216,0.14); --line-soft:rgba(236,231,216,0.08);
    --accent:#82B3BB; --accent-ink:#12201F; --accent-soft:rgba(130,179,187,0.14); --accent-soft-2:rgba(130,179,187,0.26);
    --seal:#E27967; --seal-soft:rgba(226,121,103,0.16);
    --good:#71C199; --good-soft:rgba(113,193,153,0.15);
    --warn:#E1AE58; --warn-soft:rgba(225,174,88,0.16);
    --neutral:#9C9480; --neutral-soft:rgba(156,148,128,0.15);
    --shadow:0 1px 2px rgba(0,0,0,0.35), 0 10px 28px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--font-body);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
  button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

  .app-shell{display:flex; align-items:flex-start; min-height:100vh;}
  .sidebar{
    width:236px; flex-shrink:0; background:var(--surface-2);
    border-right:1px solid var(--line); padding:26px 16px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:22px;
  }
  .brand{font-size:1.2rem; font-weight:600; color:var(--ink); padding:0 8px; letter-spacing:.01em;}
  .brand-sub{display:block; font-family:var(--font-body); font-size:.72rem; font-weight:400; color:var(--ink-faint); margin-top:3px; letter-spacing:.04em;}
  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    width:100%; text-align:left; background:transparent; border:none; border-left:3px solid transparent;
    padding:10px 11px; border-radius:0 var(--radius-sm) var(--radius-sm) 0; cursor:pointer;
    color:var(--ink-dim); transition:background .15s,color .15s,border-color .15s;
  }
  .nav-item:hover{background:var(--accent-soft); color:var(--ink);}
  .nav-item-active{background:var(--accent-soft-2); border-left-color:var(--accent); color:var(--ink); font-weight:600;}
  .nav-label{font-size:.92rem;}
  .nav-count{font-family:var(--font-mono); font-size:.74rem; background:var(--surface); border:1px solid var(--line); color:var(--ink-dim); padding:1px 7px; border-radius:999px;}
  .nav-item-active .nav-count{color:var(--accent); border-color:var(--accent-soft-2);}
  .nav-ext{font-size:.7rem; color:var(--ink-faint); letter-spacing:.02em;}

  .main{flex:1; min-width:0; padding:30px 40px 60px; max-width:1180px;}
  .main-topbar{display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-bottom:14px;}
  .save-pill{font-size:.76rem; font-weight:600; padding:4px 12px; border-radius:999px; display:inline-flex; align-items:center; gap:6px; letter-spacing:.01em;}
  .save-pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .pill-neutral{background:var(--neutral-soft); color:var(--neutral);}
  .pill-good{background:var(--good-soft); color:var(--good);}
  .pill-warn{background:var(--warn-soft); color:var(--warn);}
  .pill-seal{background:var(--seal-soft); color:var(--seal);}

  .banner{padding:10px 16px; border-radius:var(--radius-sm); font-size:.85rem; margin-bottom:18px; border:1px solid var(--line);}
  .banner-neutral{background:var(--neutral-soft); color:var(--ink-dim); border-color:var(--line);}
  .banner-warn{background:var(--warn-soft); color:var(--warn); border-color:transparent;}

  .view-header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px;}
  .view-title{font-size:1.5rem; font-weight:600; color:var(--ink); display:flex; align-items:baseline; gap:10px;}
  .view-count{font-family:var(--font-mono); font-size:.85rem; font-weight:500; color:var(--ink-faint);}
  .view-tools{display:flex; gap:10px; align-items:center;}
  .search-input{width:220px;}

  .input{
    font-family:var(--font-body); font-size:.88rem; padding:8px 12px;
    border:1px solid var(--line); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--ink); width:100%;
  }
  textarea.input{resize:vertical; min-height:64px; font-family:var(--font-body);}
  .input::placeholder{color:var(--ink-faint);}

  .btn{
    font-family:var(--font-body); font-weight:600; font-size:.85rem; padding:8px 16px;
    border-radius:var(--radius-sm); border:1px solid transparent; cursor:pointer;
    transition:opacity .15s,background .15s,border-color .15s; white-space:nowrap;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--line);}
  .btn-ghost:hover{background:var(--accent-soft);}
  .btn-danger{background:transparent; color:var(--seal); border-color:var(--seal-soft);}
  .btn-danger:hover{background:var(--seal-soft);}
  .btn-sm{padding:5px 11px; font-size:.78rem;}
  .btn:disabled{opacity:.4; cursor:not-allowed; background:transparent; color:var(--ink-faint); border-color:var(--line);}

  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(288px,1fr)); gap:14px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--card-color,var(--neutral));
    border-radius:var(--radius-md); padding:15px 17px 13px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:8px; position:relative;
  }
  .card-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .card-id{font-family:var(--font-mono); font-size:.72rem; color:var(--ink-faint); letter-spacing:.02em;}
  .chip{display:inline-flex; align-items:center; padding:2px 10px; border-radius:999px; font-size:.72rem; font-weight:600; letter-spacing:.02em; white-space:nowrap;}
  .chip-accent{background:var(--accent-soft); color:var(--accent);}
  .chip-good{background:var(--good-soft); color:var(--good);}
  .chip-warn{background:var(--warn-soft); color:var(--warn);}
  .chip-seal{background:var(--seal-soft); color:var(--seal);}
  .chip-neutral{background:var(--neutral-soft); color:var(--neutral);}
  .chip-outline{background:transparent; color:var(--ink-dim); border:1px solid var(--line);}
  .card-top-chips{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .card-title{font-size:1.02rem; font-weight:600; color:var(--ink); line-height:1.35;}
  .card-meta{display:flex; flex-direction:column; gap:3px;}
  .card-meta p{margin:0; font-size:.82rem; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .card-actions{display:flex; gap:8px; margin-top:4px;}

  .empty-state,.empty-state-sm{color:var(--ink-faint); font-size:.9rem; padding:34px 4px; text-align:center; border:1px dashed var(--line); border-radius:var(--radius-md); background:var(--surface-2);}
  .empty-state-sm{padding:16px 4px;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:26px;}
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:18px 20px; box-shadow:var(--shadow);}
  .stat-card-alert{border-color:var(--seal-soft); background:linear-gradient(180deg,var(--seal-soft),var(--surface) 60%);}
  .stat-num{font-family:var(--font-mono); font-size:2.15rem; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink); line-height:1;}
  .stat-card-alert .stat-num{color:var(--seal);}
  .stat-label{font-size:.86rem; color:var(--ink-dim); margin-top:6px; font-weight:600;}
  .stat-sub{font-size:.76rem; color:var(--ink-faint); margin-top:3px;}
  .stat-card-link{display:block; text-decoration:none; color:inherit; transition:border-color .15s,opacity .15s;}
  .stat-card-link:hover{border-color:var(--accent-soft-2); opacity:.94;}
  .stat-num-arrow{color:var(--accent);}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:18px 20px; box-shadow:var(--shadow);}
  .panel-title{font-size:1.05rem; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .external-panel{max-width:520px;}
  .external-desc{font-size:.9rem; color:var(--ink-dim); line-height:1.7; margin:0 0 20px;}

  .flagged-panel{border-color:var(--warn-soft); background:linear-gradient(180deg,var(--warn-soft),var(--surface) 70%); margin-bottom:18px;}
  .flagged-list{display:flex; flex-direction:column; gap:10px;}
  .flagged-row{display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 14px;}
  .flagged-info{min-width:0;}
  .flagged-info strong{font-size:.88rem; color:var(--ink);}
  .flagged-meeting{font-size:.8rem; color:var(--ink-dim); margin-left:4px;}
  .flagged-text{margin:3px 0 0; font-size:.78rem; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:440px;}

  .item-list-field{display:flex; flex-direction:column; gap:8px;}
  .item-list{display:flex; flex-direction:column; gap:8px;}
  .item-row{display:flex; gap:10px; align-items:flex-start; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 10px;}
  .item-row .item-text{flex:1; min-height:44px;}
  .item-track-toggle{display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--ink-dim); white-space:nowrap; padding-top:9px;}
  .item-track-toggle input{margin:0;}
  .item-remove{flex-shrink:0; margin-top:2px;}
  .item-add-btn{align-self:flex-start;}

  .overlay{position:fixed; inset:0; background:rgba(20,19,16,0.44); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{background:var(--surface); border-radius:var(--radius-lg); padding:26px 28px; width:100%; max-width:580px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow);}
  .modal-sm{max-width:400px;}
  .modal-title{font-size:1.15rem; font-weight:600; margin-bottom:16px;}
  .modal-text{font-size:.9rem; color:var(--ink-dim); margin:0 0 20px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; margin-bottom:20px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field-full{grid-column:1 / -1;}
  .field-label{font-size:.78rem; font-weight:600; color:var(--ink-dim); letter-spacing:.02em;}
  .field-heading{font-family:var(--font-display); font-weight:600; font-size:1rem; color:var(--ink); border-top:1px solid var(--line); padding-top:16px; margin-top:2px;}
  .file-field{display:flex; flex-direction:column; gap:8px; padding:12px; border:1px dashed var(--line); border-radius:var(--radius-sm); background:var(--surface-2);}
  .file-input-native{font-size:.82rem; color:var(--ink-dim);}
  .file-chip{font-size:.82rem; color:var(--ink-dim);}
  .file-empty{font-size:.82rem; color:var(--ink-faint);}
  .card-attachment{margin-top:2px;}
  .card-attach-img{max-width:100%; max-height:150px; border-radius:var(--radius-sm); border:1px solid var(--line); object-fit:cover; display:block;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px;}

  #toast-root{position:fixed; right:20px; bottom:20px; z-index:80;}
  .toast{background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:var(--radius-sm); font-size:.85rem; box-shadow:var(--shadow);}

  @media (max-width:820px){
    .app-shell{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; padding:14px 16px; gap:16px;}
    .brand{display:none;}
    .nav{flex-direction:row;}
    .nav-item{border-left:none; border-bottom:3px solid transparent; border-radius:var(--radius-sm); white-space:nowrap;}
    .nav-item-active{border-bottom-color:var(--accent);}
    .main{padding:22px 18px 50px;}
    .form-grid{grid-template-columns:1fr;}
  }

  /* ---- login gate ---- */
  .login-gate{position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center; padding:20px; z-index:200;}
  .login-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:34px 32px; width:100%; max-width:360px; text-align:center;}
  .login-title{font-size:1.3rem; font-weight:600; margin-bottom:6px;}
  .login-sub{font-size:.84rem; color:var(--ink-dim); margin:0 0 22px; line-height:1.5;}
  .login-input{text-align:left; font-size:.95rem; margin-bottom:12px;}
  .login-error{font-size:.8rem; color:var(--seal); min-height:18px; margin-bottom:8px;}
  .login-btn{width:100%;}
  .login-toggle{margin-top:14px; background:none; border:none; color:var(--accent); font-size:.8rem; cursor:pointer; text-decoration:underline; padding:4px;}
  .app-loading{position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:.9rem;}

  /* ---- accounts / audit ---- */
  .current-user{font-size:.8rem; color:var(--ink-dim); font-weight:600; margin-right:10px; align-self:center;}
  .add-teammate-form{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .add-teammate-form .input{width:auto; flex:1; min-width:140px;}
  .card-audit{margin:0; font-size:.72rem; color:var(--ink-faint);}
  .perm-grid{display:flex; flex-wrap:wrap; gap:8px 16px; margin:6px 0 10px;}
  .perm-item{display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--ink-dim); cursor:pointer;}
  .perm-item input{margin:0;}
  .perm-edit-form{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
</style>
</head>
<body>
<div id="login-root"></div>
<div id="app-root"></div>
<div id="toast-root"></div>
<script src="/app.js"></script>
</body>
</html>
